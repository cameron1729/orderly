name: Prepare the PHP verification runtime
description: Build and cache the exact stock PHP release used by the opcode proof

runs:
  using: composite
  steps:
    - name: Restore the pinned PHP build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/orderly-php
        key: orderly-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('layers/common/php/profile.json', 'layers/common/php/build.sh') }}

    - name: Build the verification runtime
      shell: bash
      run: bash "${{ github.action_path }}/build.sh" "$RUNNER_TEMP/orderly-php"

    - name: Select the isolated PHP runtime
      shell: bash
      run: |
        prefix="$RUNNER_TEMP/orderly-php"
        extension_dir=$("$prefix/bin/php-config" --extension-dir)
        printf 'ORDERLY_PHP_BIN=%s/bin/php\nORDERLY_PHP_OPCACHE=%s/opcache.so\n' \
          "$prefix" "$extension_dir" >> "$GITHUB_ENV"
