from: markdown+tex_math_dollars+gfm_auto_identifiers
to: latex
standalone: true
number-sections: true
pdf-engine: xelatex
pdf-engine-opts:
  - -no-shell-escape
template: layers/common/pdf/template.tex
filters:
  - layers/common/pdf/document.lua
metadata:
  title: On the Correctness of Orderly
  author: Cameron Ball
  paper: true
  abstract: >-
    In this paper, we define correctness for the Orderly Composer package and
    present an argument, checked in Lean, establishing it under stated conditions.
    We then provide verifiable evidence that those conditions hold for the
    revision under consideration.
  document_kind: correctness
  sources:
    - path: layers/common/templates/correctness.md
      id: definitions
      kind: template
      definition: layers/CORRECTNESS.md
    - path: layers/0-theory/templates/proof.md
      id: layer-0
      kind: template
